<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="__CSP__">
    <title>Satori</title>
    <link rel="stylesheet" href="__MEDIA__/trail/min/trail.css">
</head>
<body>
    <div id="app">
        <header id="topbar">
            <div class="nav-buttons">
                <button id="btn-home" type="button"></button>
                <button id="btn-back" type="button" disabled></button>
                <button id="btn-forward" type="button" disabled></button>
                <button id="btn-reset" type="button"></button>
            </div>
            <div id="trail-crumbs" aria-label="Trail"></div>
            <div id="search-wrap">
                <span id="search-icon" aria-hidden="true"></span>
                <input id="search" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="search-results">
                <div id="search-results" role="listbox" hidden></div>
            </div>
            <div class="filters" id="filters"></div>
            <div class="zoom-controls" role="group" aria-label="Zoom">
                <button id="btn-zoom-out" type="button"></button>
                <button id="zoom-label" type="button">100%</button>
                <button id="btn-zoom-in" type="button"></button>
            </div>
            <div class="mode-buttons">
                <button id="btn-audit" type="button" aria-pressed="false" aria-controls="auditpanel"></button>
                <button id="btn-edit" type="button" aria-pressed="false"></button>
                <button id="btn-help" type="button" aria-pressed="false" aria-controls="hud"></button>
            </div>
        </header>
        <div id="flowpath" class="filters" hidden></div>
        <section id="layerflow" aria-label="Layer flow"></section>
        <section id="auditpanel" hidden></section>
        <main id="stage">
            <div id="painttools" role="toolbar" hidden></div>
            <aside id="hud" hidden></aside>
            <div id="zoomsizer">
                <div id="canvas" class="lod-detail">
                    <svg id="edges" aria-hidden="true"></svg>
                    <div id="columns"></div>
                    <svg id="paint" aria-hidden="true"></svg>
                </div>
            </div>
        </main>
        <section id="codepane">
            <aside id="refs" aria-label="References"></aside>
            <div id="code">
                <div id="code-head">
                    <span id="code-title"></span>
                    <span id="code-file"></span>
                    <button id="btn-open" type="button" hidden></button>
                </div>
                <div id="code-body" tabindex="0"></div>
            </div>
        </section>
    </div>

    <div id="ctxmenu" role="menu" hidden></div>

    <script type="application/json" id="satori-data">__AST_JSON_PLACEHOLDER__</script>
    <script type="application/json" id="satori-i18n">__TRANSLATIONS__</script>
    <script nonce="__NONCE__" src="__MEDIA__/trail/min/trail_icons.js"></script>
    <script nonce="__NONCE__" src="__MEDIA__/trail/min/trail_model.js"></script>
    <script nonce="__NONCE__" src="__MEDIA__/trail/min/trail_paint.js"></script>
    <script nonce="__NONCE__" src="__MEDIA__/trail/min/trail_view.js"></script>
</body>
</html>
